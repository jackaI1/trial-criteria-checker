name: Tests and saved reports
on:
  push:
    branches: [main, 'skills/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run all tests
        run: python -m unittest discover -s tests -v
      - name: Verify published results without a network call
        run: python scripts/reproduce.py --check
