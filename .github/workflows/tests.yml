name: Tests and saved reports
on:
  push:
    branches: [main, 'skills/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run all tests
        run: python -m unittest discover -s tests -v
      - name: Verify published results without a network call
        run: python scripts/reproduce.py --check
  demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every demo quote against the trial text and the data file is current
        run: python scripts/build_demo.py --check
      - name: Test the demo's matching logic and the typing worker
        run: node --test tests/js/*.test.mjs
